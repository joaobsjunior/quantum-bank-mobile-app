name: quantum_bank_mobile
description: Quantum Bank mobile security bootstrap and gateway client package.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # ASN.1 encoding for the CSR and PKCS#8 material, plus ECDSA P-256 for the
  # compatibility-chain identity.
  pointycastle: ^4.0.0
  # Pure-Dart ML-DSA (FIPS 204) for the post-quantum device identity key pair
  # and CSR signature.
  pqcrypto: ^0.4.1
  # X25519 (RFC 7748) for the classical half of the hybrid application
  # envelope; pure Dart on the VM.
  cryptography: ^2.9.0
  # `visibleForTesting` on the pure-Dart PQC modules (no Flutter import there,
  # so `dart run tool/...` keeps working).
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.26.0

flutter:
  uses-material-design: true
  assets:
    - assets/local-ca/root-ca.crt
    - assets/local-ca/root-ca-compat.crt

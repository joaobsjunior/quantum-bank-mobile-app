name: quantum_bank_mobile
description: Quantum Bank mobile security bootstrap and gateway client package.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # ASN.1 encoding for the CSR and PKCS#8 material, plus ECDSA P-256 for the
  # compatibility-chain identity.
  pointycastle: ^4.0.0
  # Pure-Dart ML-DSA (FIPS 204) for the post-quantum device identity key pair
  # and CSR signature.
  pqcrypto: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.26.0

flutter:
  uses-material-design: true
  assets:
    - assets/local-ca/root-ca.crt
    - assets/local-ca/root-ca-compat.crt
